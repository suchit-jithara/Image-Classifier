version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
  app:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8001:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

volumes:
  qdrant_storage:
